<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
<title>Hỏi Pet</title>
<link rel="stylesheet" href="common.css">
<style>
  html, body { background: transparent; height: 100%; overflow: hidden; }
  .box { position: absolute; inset: 6px; display: flex; flex-direction: column; border-radius: 14px; overflow: hidden;
    background: linear-gradient(180deg, #221a31, #140f20); border: 1.5px solid var(--gold2); box-shadow: 0 10px 30px #000a, 0 0 0 1px #000; }
  header { display: flex; align-items: center; gap: 6px; padding: 7px 9px; background: #0b0912; border-bottom: 1px solid #2c2440; -webkit-app-region: drag; }
  header b { font-size: 12px; color: var(--gold); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  header button { -webkit-app-region: no-drag; padding: 0; width: 20px; height: 18px; font-size: 11px; }
  #log { flex: 1; overflow: auto; padding: 9px; display: flex; flex-direction: column; gap: 7px; }
  .m { max-width: 85%; font-size: 12px; line-height: 1.4; padding: 6px 9px; border-radius: 12px; white-space: pre-wrap; word-break: break-word; }
  .m.pet { align-self: flex-start; background: #fffbeb; color: #1c1917; border-bottom-left-radius: 4px; }
  .m.me { align-self: flex-end; background: #3b2d5c; color: #ece7f7; border: 1px solid #5b4a86; border-bottom-right-radius: 4px; }
  .m.wait { opacity: .6; font-style: italic; }
  .empty { margin: auto; text-align: center; font-size: 11px; color: var(--dim); line-height: 1.5; padding: 0 12px; }
  .crow { display: flex; gap: 5px; padding: 7px; border-top: 1px solid #2c2440; background: #0b0912; }
  #q { flex: 1; min-width: 0; font-size: 12px; padding: 6px 9px; background: #171226; }
  #go { padding: 0 10px; }
</style>
</head>
<body>
<div class="box">
  <header><b id="who">Hỏi Pet</b><button id="clear" title="Xóa ghi nhớ thói quen trò chuyện">🧠</button><button id="close" title="Đóng (Esc)">✕</button></header>
  <div id="log"></div>
  <div class="crow"><input id="q" maxlength="500" placeholder="Hỏi gì cũng được… (Enter)" autocomplete="off"><button id="go" title="Gửi">➤</button></div>
</div>
<script src="../data/vocab-zh.js"></script>
<script src="../game.js"></script>
<script src="common.js"></script>
<script src="chat.js"></script>
</body>
</html>
