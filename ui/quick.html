<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
<title>Thêm nhanh</title>
<link rel="stylesheet" href="common.css">
<style>
  html, body { background: transparent; height: 100%; overflow: hidden; }
  .box { position: absolute; inset: 10px; border-radius: 16px; padding: 14px 16px; display: grid; gap: 8px; align-content: start;
    background: linear-gradient(180deg, #221a31, #110d1a); border: 1.5px solid var(--gold2); box-shadow: 0 10px 30px #000a, 0 0 0 1px #000; }
  .row { display: flex; gap: 10px; align-items: center; }
  .row > span { font-size: 22px; }
  input { flex: 1; font-size: 18px; padding: 10px 12px; background: #0b0912; }
  .hint { font-size: 12px; color: var(--dim); }
  .hint code { color: var(--gold); font-family: var(--mono); background: #0006; padding: 0 4px; border-radius: 4px; }
  #preview { font-size: 12px; color: var(--ok); min-height: 18px; }
</style>
</head>
<body>
<div class="box">
  <div class="row"><span>📜</span><input id="q" placeholder="Gõ nhiệm vụ / ý tưởng rồi Enter…" autocomplete="off" spellcheck="false"></div>
  <div class="hint">Mẹo: <code>#tt</code> Trí tuệ · <code>#tc</code> Thể chất · <code>#st</code> Sáng tạo · <code>#tn</code> Tinh thần · <code>!1</code>…<code>!3</code> độ khó · <code>@nay</code> hôm nay · <code>@tuan</code> · <code>@tuansau</code> · <code>@17:30</code> hạn giờ · Esc để đóng</div>
  <div id="preview"></div>
</div>
<script src="../game.js"></script>
<script src="quick.js"></script>
</body>
</html>
